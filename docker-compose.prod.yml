# docker-compose.prod.yml
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    depends_on: [postgres, redis]
    restart: unless-stopped

  caddy:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    depends_on: [backend]
    # 80 is not optional: Let's Encrypt validates over it, and Caddy uses it to
    # redirect plain HTTP to HTTPS.
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    # caddy_data holds the issued certificates and the ACME account key. Without
    # it every rebuild would re-request the certificate, and Let's Encrypt caps
    # identical certificates at 5 per week.
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
